name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag to publish under. Defaults to prerelease label or latest."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'fraction12/deepclean'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Use npm with trusted publishing support
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - run: npm run release:check

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_NPM_TAG: ${{ inputs.npm_tag || '' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expectedTag = `v${pkg.version}`;
          if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${expectedTag}`);
          }
          const prerelease = pkg.version.includes("-") ? pkg.version.split("-")[1].split(".")[0] : "";
          const npmTag = process.env.INPUT_NPM_TAG || prerelease || "latest";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `package_name=${pkg.name}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `package_version=${pkg.version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `npm_tag=${npmTag}\n`);
          NODE

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --access public --tag "${{ steps.meta.outputs.npm_tag }}" --provenance

      - name: Published package
        run: |
          echo "${{ steps.meta.outputs.package_name }}@${{ steps.meta.outputs.package_version }}"
          echo "dist-tag: ${{ steps.meta.outputs.npm_tag }}"
