name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag to publish under. Defaults to prerelease label or latest."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'fraction12/deepclean'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - run: npm run release:check

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_NPM_TAG: ${{ inputs.npm_tag || '' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: node scripts/release-metadata.mjs

      - name: Preflight npm dist-tag promotion credentials
        if: steps.meta.outputs.promotion_tags != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is required for beta releases that promote npm latest." >&2
            exit 1
          fi
          npm whoami --registry https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --access public --tag "${{ steps.meta.outputs.npm_tag }}" --provenance

      - name: Promote npm dist-tags
        if: steps.meta.outputs.promotion_tags != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_SPEC: ${{ steps.meta.outputs.package_name }}@${{ steps.meta.outputs.package_version }}
          PROMOTION_TAGS: ${{ steps.meta.outputs.promotion_tags }}
        run: |
          for tag in $PROMOTION_TAGS; do
            npm dist-tag add "$PACKAGE_SPEC" "$tag" --registry https://registry.npmjs.org
          done

      - name: Verify npm dist-tags
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.package_version }}
          NPM_TAG: ${{ steps.meta.outputs.npm_tag }}
          PROMOTION_TAGS: ${{ steps.meta.outputs.promotion_tags }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          const packageName = process.env.PACKAGE_NAME;
          const packageVersion = process.env.PACKAGE_VERSION;
          const expectedTags = [process.env.NPM_TAG, ...process.env.PROMOTION_TAGS.split(/\s+/)]
            .filter(Boolean);

          for (let attempt = 1; attempt <= 6; attempt += 1) {
            const output = execFileSync(
              "npm",
              ["view", packageName, "dist-tags", "--json", "--registry", "https://registry.npmjs.org"],
              { encoding: "utf8" },
            );
            const tags = JSON.parse(output);
            const staleTags = expectedTags.filter((tag) => tags[tag] !== packageVersion);
            if (staleTags.length === 0) {
              console.log(`Verified npm dist-tags: ${expectedTags.join(", ")}`);
              process.exit(0);
            }
            if (attempt < 6) {
              console.log(`Waiting for npm dist-tags: ${staleTags.join(", ")}`);
              execFileSync("sleep", ["5"]);
            }
          }

          throw new Error(`npm dist-tags did not resolve to ${packageName}@${packageVersion}`);
          NODE

      - name: Published package
        run: |
          echo "${{ steps.meta.outputs.package_name }}@${{ steps.meta.outputs.package_version }}"
          echo "dist-tag: ${{ steps.meta.outputs.npm_tag }}"
          echo "promoted-tags: ${{ steps.meta.outputs.promotion_tags }}"
