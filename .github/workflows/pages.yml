name: Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "scripts/build-site.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, dushyantpc, home-linux-trusted]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - uses: actions/configure-pages@v5

      - run: npm run site:build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site-dist

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, dushyantpc, home-linux-trusted]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
