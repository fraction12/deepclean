profile: deepclean-check
provider: ssh
target: linux
static:
  host: 100.113.203.102
  user: root
  port: "2222"
  workRoot: /root/crabbox/deepclean
ssh:
  key: ~/.ssh/dushyantpc_ci_ed25519
sync:
  delete: true
  checksum: false
  gitSeed: true
  fingerprint: true
  timeout: 15m
  warnFiles: 50000
  warnBytes: 5368709120
  failFiles: 150000
  failBytes: 21474836480
  exclude:
    - .cache
    - .turbo
    - dist
    - node_modules
    - .npm
    - .yarn/cache
    - .venv
run:
  preflightTools:
    - git
    - node
    - npm
    - codex
    - gh
env:
  allow:
    - CI
    - NODE_OPTIONS
    - GITHUB_*
    - GH_*
    - OCTOCHECK_*
    - CODEX_*
    - OPENAI_*
jobs:
  ci:
    shell: true
    command: |
      set -euo pipefail
      export CI=true
      npm ci
      npm run ci
      node scripts/spec-validate.mjs
    stop: auto
  review:
    shell: true
    command: |
      set -euo pipefail
      export CI=true
      node scripts/octocheck-review.mjs
    stop: auto
